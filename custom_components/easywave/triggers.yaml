# Feature enums resolve via homeassistant.components.easywave (HACS aliases
# that module in __init__.py; Core ships the same names natively).

button_press_a:
  target:
    primary_entities_only: true
    entity:
      - integration: easywave
        domain: sensor
        device_class: enum
        supported_features:
          - easywave.EasywaveTransmitterFeature.BUTTON_A

